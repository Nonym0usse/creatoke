<div class="pbar" [class.pbar--indeterminate]="indeterminate">
  <div class="pbar__head" *ngIf="label || !indeterminate">
    <span class="pbar__label">{{ label }}</span>
    <span class="pbar__value" *ngIf="!indeterminate">{{ percent }} %</span>
  </div>
  <div class="pbar__track" role="progressbar" [attr.aria-label]="label || 'Progression'" aria-valuemin="0"
    aria-valuemax="100" [attr.aria-valuenow]="indeterminate ? null : percent">
    <div class="pbar__fill" [style.width.%]="indeterminate ? null : percent"></div>
  </div>
</div>

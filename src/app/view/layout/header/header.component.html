
<!-- Bind header view according input from parent -->
<ng-container [ngTemplateOutlet]="headerTemplate ? headerTemplate : null"></ng-container>


<!-- Landing header view -->
<ng-template #landingHeader>
    <!-- Start:: header [[ Find at scss/framework/header.scss ]] -->
    <header id="main_header">
        <div class="container">
            <nav class="navbar navbar-expand-lg">
                <app-brand></app-brand>
                <div class="d-flex align-items-center navbar-ex">
                    <a class="btn btn-primary" routerLink="/song/chansons-a-chanter">Découvrir les chansons</a>
                    <button class="navbar-toggler ms-3 ms-sm-4" type="button" data-bs-toggle="collapse" data-bs-target="#top_navbar" aria-controls="top_navbar" aria-expanded="false" aria-label="Toggle navigation">
                        <i class="ri-menu-3-fill"></i>
                    </button>
                </div>
                
            </nav>
        </div>
    </header>
    <!-- End:: header -->
</ng-template>

<!-- App header view -->
<ng-template #appHeader>
    <!-- Start:: header [[ Find at scss/framework/header.scss ]] -->
    <header id="header" #header>
        <div class="container">
            <div class="header-container">
                <div class="d-flex align-items-center">
                    <a role="button" class="header-text sidebar-toggler d-lg-none me-3" aria-label="Sidebar toggler" (click)="toggler()">
                        <i class="ri-menu-3-line"></i>
                    </a>

                    <app-search></app-search>

                    <div class="d-flex align-items-center">
                        <!-- Mode clair / sombre -->
                        <button type="button" class="mode-toggle header-text ms-3 ms-sm-4" (click)="toggleColorMode()"
                            *ngIf="{ light: lightMode$ | async } as m"
                            [attr.aria-label]="m.light ? 'Passer en mode sombre' : 'Passer en mode clair'"
                            [title]="m.light ? 'Passer en mode sombre' : 'Passer en mode clair'">
                            <i [class]="m.light ? 'ri-moon-line' : 'ri-sun-line'"></i>
                        </button>

                        <div class="dropdown ms-3 ms-sm-4" *ngIf="isAuthenticated">
                            <ng-container [ngTemplateOutlet]="userDropdown"></ng-container>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- End:: header -->
</ng-template>




<!-- Template for user dropdown : compte + administration -->
<ng-container >
  <ng-template #userDropdown>
    <a class="avatar header-text admin-trigger" role="button" id="user_menu" data-bs-toggle="dropdown" aria-expanded="false">
      <div class="avatar__image">
        <img *ngIf="!imgError" [src]="imgProfile" alt="" (error)="imgError = true">
        <span *ngIf="imgError" class="admin-initial">{{ (userEmail || 'A')[0] | uppercase }}</span>
      </div>
      <span class="ps-2 d-none d-sm-block">Admin</span>
      <i class="ri-arrow-down-s-line ps-1 d-none d-sm-block"></i>
    </a>
    <ul class="dropdown-menu dropdown-menu-md dropdown-menu-end admin-menu" aria-labelledby="user_menu">
      <li>
        <div class="py-2 px-3 avatar avatar--lg">
          <div class="avatar__image">
            <img *ngIf="!imgError" [src]="imgProfile" alt="" (error)="imgError = true">
            <span *ngIf="imgError" class="admin-initial">{{ (userEmail || 'A')[0] | uppercase }}</span>
          </div>
          <div class="avatar__content">
            <span class="avatar__title">{{ userEmail }}</span>
            <span class="avatar__subtitle">Administrateur</span>
          </div>
        </div>
      </li>
      <ng-container *ngFor="let group of adminMenu">
        <li><div class="dropdown-divider"></div></li>
        <li><span class="admin-menu__head">{{ group.head }}</span></li>
        <li *ngFor="let item of group.items">
          <a class="dropdown-item d-flex align-items-center" [routerLink]="item.link" routerLinkActive="active">
            <i [class]="item.icon + ' fs-5'"></i>
            <span class="ps-2">{{ item.name }}</span>
          </a>
        </li>
      </ng-container>
      <li>
        <div class="dropdown-divider"></div>
      </li>
      <li>
        <a class="dropdown-item d-flex align-items-center text-danger" role="button" (click)="logout()">
          <i class="ri-logout-circle-line fs-5"></i>
          <span class="ps-2">Déconnexion</span>
        </a>
      </li>
    </ul>
  </ng-template>
</ng-container>

<!-- Connexion à l'espace d'administration : carte centrée sur l'image de fond floutée -->
<div class="login">
    <div class="login__bg" *ngIf="picturebackground" [style.background-image]="'url(&quot;' + picturebackground + '&quot;)'"></div>

    <div class="login__card">
        <img src="./assets/images/logos/logo.png" alt="Créatoké" class="login__logo">
        <h1>Administration</h1>
        <p class="login__intro">Connectez-vous pour gérer le site.</p>

        <div class="login__error" *ngIf="message" role="alert">
            <i class="ri-error-warning-line"></i><span>{{ message }}</span>
        </div>

        <form [formGroup]="form" (ngSubmit)="login()" novalidate>
            <div>
                <label class="login__input" [class.is-invalid]="showError('email')">
                    <i class="ri-mail-line"></i>
                    <input type="email" id="email" formControlName="email" autocomplete="username"
                        placeholder="Adresse e-mail" aria-label="Adresse e-mail">
                </label>
                <p class="login__field-error" *ngIf="showError('email')">
                    {{ form.get('email')?.hasError('required') ? 'Saisissez votre adresse e-mail.' : 'Adresse e-mail invalide.' }}
                </p>
            </div>

            <div>
                <label class="login__input" [class.is-invalid]="showError('password')">
                    <i class="ri-lock-2-line"></i>
                    <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
                        autocomplete="current-password" placeholder="Mot de passe" aria-label="Mot de passe">
                    <button type="button" class="login__toggle" (click)="showPassword = !showPassword"
                        [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
                        <i [class]="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
                    </button>
                </label>
                <p class="login__field-error" *ngIf="showError('password')">Saisissez votre mot de passe.</p>
            </div>

            <button type="submit" class="login__submit" [disabled]="form.invalid || loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                {{ loading ? 'Connexion…' : 'Se connecter' }}
            </button>
        </form>

        <p class="login__hint">Mot de passe oublié ? Contactez la personne qui gère l'hébergement.</p>
    </div>

    <a routerLink="/" class="login__back"><i class="ri-arrow-left-line"></i> Retour au site</a>
</div>
